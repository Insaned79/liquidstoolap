name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-fcl fp-units-net
      - name: Build Stoolap FFI
        run: scripts/build-stoolap.sh
      - name: Server unit tests
        run: make -C server test
      - name: Server smoke
        run: |
          if ! (make -C server build && cd server && bash -x tests/smoke.sh) >server-smoke-ci.log 2>&1; then
            cat server-smoke-ci.log
            summary="$(tail -n 30 server-smoke-ci.log | tr '\n' ' ' | cut -c1-4000)"
            echo "::error title=Server smoke failed::$summary"
            exit 1
          fi
          cat server-smoke-ci.log

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-fcl fp-units-net
      - name: Build Stoolap FFI
        run: scripts/build-stoolap.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK dependencies
        run: python -m pip install -e "sdk/python[dev]"
      - name: SDK lint
        run: |
          ruff check sdk/python/src sdk/python/tests
          mypy sdk/python/src/liquidstoolap
      - name: SDK unit tests
        run: pytest -q sdk/python/tests/test_models.py sdk/python/tests/test_client_errors.py
      - name: SDK smoke
        run: |
          if ! python sdk/python/tests/smoke_sdk.py >sdk-smoke-ci.log 2>&1; then
            cat sdk-smoke-ci.log
            summary="$(tail -n 30 sdk-smoke-ci.log | tr '\n' ' ' | cut -c1-4000)"
            echo "::error title=SDK smoke failed::$summary"
            exit 1
          fi
          cat sdk-smoke-ci.log
      - name: SDK build artifacts
        run: python -m build sdk/python

  node-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node-RED package checks
        working-directory: packages/node-red
        run: |
          npm test
          npm run pack:check
